name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24.x: the data layer uses the built-in node:sqlite for its tests,
          # which avoids a native dependency but needs a recent runtime.
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run check
